name: Python Snake Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  run-python-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    # Mengarahkan robot agar membaca file di dalam folder unggahan Anda
    - name: Run Python Script
      run: python github-snake-python/generate_snake.py

    # Menyimpan hasilnya agar sejajar di halaman depan
    - name: Commit and Push GIF
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add dist/python-snake.gif
        git commit -m "Update animasi ular dari Python script" || exit 0
        git push origin main
